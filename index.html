<style>

#srch{display:flex;align-items:center;gap:4px;margin:0 8px 8px;flex:1;max-width:260px}#srch input{flex:1;min-width:0;padding:7px 10px;font-size:15px;border:1px solid #ccc;border-radius:16px}#sx{cursor:pointer;color:#999;padding:0 4px}
#sres h4{margin:16px 0 6px;color:#666}#sres li{display:block;cursor:pointer}#sres li:hover{background:#f3fbf5}#sres small{display:block;margin:0 0 2px;color:#999}#sres mark{background:#fff176}.flash{outline:3px solid #f5a623}

#imgview{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}#imgview img{max-width:96vw;max-height:96vh}
#txt img{height:auto}#txt img.imgsel{outline:3px solid #3b6;outline-offset:2px}#txt img{cursor:pointer}

#imghdl{position:absolute;z-index:50;width:18px;height:18px;background:#3b6;border:2px solid #fff;border-radius:4px;cursor:nwse-resize;touch-action:none}
</style></head><body>
<nav><button class="t on" id="tn">Daily Notes</button><button class="t" id="tt">Tasks</button><button class="t" id="ty">Yearly Tasks</button>
<div id="srch"><input id="sq" type="search" placeholder="Search..." autocomplete="off"><span id="sx" title="Clear" hidden>✕</span></div><div id="file"><span id="status" class="warn">Not signed in</span>
<button class="b" id="signin">Sign in with Microsoft</button><button class="b" id="imp" hidden>Import old data file</button><button class="b" id="signout" hidden>Sign out</button><input type="file" id="impf" accept=".json,application/json" hidden></div></nav>
<div id="setup" hidden><h2>Almost ready</h2><p>This app needs a Microsoft app registration before it can save to OneDrive. Paste the Application (client) ID into <code>CLIENT_ID</code> at the top of the script in <code>index.html</code>, then reload.</p></div>
<main>
<section id="search" hidden><div id="sres"></div></section>
<section id="notes">
<div class="hdr"><button class="b" id="prev">&#9664;</button><h2 id="day"></h2><button class="b" id="next">&#9654;</button><button class="b" id="today">Today</button></div>
<div id="tb">
<button data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button>

</section>
</main>
<script src="msal-browser.min.js"></script>
<script>
// ===== SETUP: paste your Application (client) ID from the Azure portal here =====
const CLIENT_ID = '571500df-092a-4771-985e-39799590e952';
// ===============================================================================

const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString('en-CA');
try{localStorage.removeItem('nt_data');indexedDB.deleteDatabase('nt')}catch(e){}
let data={notes:{},tasks:[],yearly:[]};
let fh=null,cur=new Date(),timer=null; // fh = true when connected to OneDrive
let etag=null,saving=false,dirty=false,acct=null,pca=null;
const SCOPES=['Files.ReadWrite.AppFolder'];
const G='https://graph.microsoft.com/v1.0/me/drive/special/approot:/notes-data.json';
function st(t,w){$('status').textContent=t;$('status').className=w?'warn':''}
const tm=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
async function token(){try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:acct})).accessToken}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES,account:acct});throw e}}
async function gfetch(url,o={}){const t=await token();o.headers=Object.assign({Authorization:'Bearer '+t},o.headers||{});return fetch(url,o)}
function norm(d){d=d||{};d.notes=d.notes||{};d.tasks=d.tasks||[];d.yearly=d.yearly||[];return d}
async function load(quiet){if(!acct||saving||dirty)return;
 const r=await gfetch(G+'?select=id,eTag,size');
 if(r.status==404){etag=null;data=norm(data);fh=true;lock(false);showDay();render();rY();await writeFile();return}
 if(!r.ok)throw new Error('Load failed ('+r.status+')');
 const m=await r.json();if(quiet&&m.eTag===etag)return;
 const c=await gfetch(G+':/content');if(!c.ok)throw new Error('Load failed ('+c.status+')');
 const t=await c.text();if(saving||dirty)return;data=norm(t.trim()?JSON.parse(t):{});etag=m.eTag;fh=true;lock(false);
 const ae=document.activeElement;const editing=ae&&ae.id=='txt';if(!editing)showDay();render();if(!document.querySelector(".det .nm:not([hidden])"))rY();st('Synced from OneDrive at '+tm());migrateImgs().then(()=>setTimeout(cleanupImgs,3000))}
async function writeFile(){if(!fh)return;if(saving){dirty=true;return}saving=true;dirty=false;
 try{const h={'Content-Type':'application/json'};if(etag)h['If-Match']=etag;else h['If-None-Match']='*';
  const r=await gfetch(G+':/content',{method:'PUT',headers:h,body:JSON.stringify(data)});
  if(r.status==412||r.status==409){saving=false;dirty=false;alert('Your notes were changed on another device. Loading the latest version from OneDrive. Your last few seconds of edits here may need to be redone.');await load();return}
  if(!r.ok)throw new Error(r.status);etag=(await r.json()).eTag;st('Saved to OneDrive at '+tm())}
 catch(e){st('Not saved! Check your connection; will retry',true);dirty=true;setTimeout(()=>{if(dirty&&!saving)writeFile()},5000)}
 saving=false;if(dirty){dirty=false;writeFile()}}
function save(){if(!fh)return;dirty=true;clearTimeout(timer);timer=setTimeout(()=>{dirty=false;writeFile()},1000)}
function ui(){$('signin').hidden=!!acct;$('signout').hidden=$('imp').hidden=!acct}
$('signin').onclick=()=>pca.loginRedirect({scopes:SCOPES,prompt:'select_account'});
$('signout').onclick=()=>{if(dirty||saving)return alert('Still saving, try again in a moment.');pca.logoutRedirect({account:acct})};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async()=>{const f=$('impf').files[0];$('impf').value='';if(!f)return;let d;try{d=norm(JSON.parse(await f.text()))}catch(e){return alert('That file is not a valid notes data file.')}
 const n=Object.keys(d.notes).length,tn=d.tasks.length,yn=d.yearly.length;
 if(confirm('Import '+f.name+' ('+n+' note days, '+tn+' tasks, '+yn+' yearly tasks)?\n\nOK = MERGE it with what is already here (keeps both)\nCancel = choose replace or cancel next')){
  for(const k in d.notes){const a=data.notes[k];data.notes[k]=a&&a!==d.notes[k]?a+'<hr>'+d.notes[k]:d.notes[k]}
  const key=x=>JSON.stringify([x.text,x.md||'',x.when||'']);const ts=new Set(data.tasks.map(key)),ys=new Set(data.yearly.map(key));
  d.tasks.forEach(x=>{if(!ts.has(key(x)))data.tasks.push(x)});d.yearly.forEach(x=>{if(!ys.has(key(x)))data.yearly.push(x)});
 }else if(confirm('REPLACE everything in the app with '+f.name+'? This cannot be undone.')){data=d}else return;
 showDay();render();rY();clearTimeout(timer);await writeFile()};
function sync(){if(acct&&document.visibilityState=='visible')load(true).catch(e=>st(e.message,true))}
document.addEventListener('visibilitychange',sync);window.addEventListener('focus',sync);
async function boot(){if(!CLIENT_ID||CLIENT_ID.includes('PASTE'+'_')){$('setup').hidden=false;st('Setup needed',true);$('signin').hidden=true;return}
 pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/2ca98f21-b5df-4a61-ab07-86f96837c4f3',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
 await pca.initialize();const r=await pca.handleRedirectPromise();acct=(r&&r.account)||pca.getAllAccounts()[0]||null;ui();
 if(acct){st('Loading from OneDrive...');try{await load()}catch(e){st(e.message,true)}}else st('Sign in to load your notes',true)}
function showDay(){const k=iso(cur);$('day').textContent=cur.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const v=data.notes[k]||'';$('txt').innerHTML=/<[a-z]/i.test(v)?v:v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');$('next').disabled=k>=iso(new Date());hydrate($('txt'));if(typeof deselImg=='function')deselImg()}
// ===== Images stored as separate files in the OneDrive app folder =====
const imgCache=new Map(); // path -> Promise<blob url>
const GI=p=>'https://graph.microsoft.com/v1.0/me/drive/special/approot:/'+p.split('/').map(encodeURIComponent).join('/')+':/content';
function getImg(p){if(!imgCache.has(p))imgCache.set(p,gfetch(GI(p)).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>URL.createObjectURL(b)).catch(e=>{imgCache.delete(p);throw e}));return imgCache.get(p)}
function hydrate(root){root.querySelectorAll('img[data-od]').forEach(im=>{if(im.getAttribute('src'))return;im.classList.add('imgload');getImg(im.dataset.od).then(u=>{im.src=u;im.classList.remove('imgload')}).catch(()=>{im.classList.remove('imgload');im.alt='(image could not be loaded: '+im.dataset.od+')'})})}
function noteHTML(){const c=$('txt').cloneNode(true);c.querySelectorAll('img').forEach(im=>{im.classList.remove('imgsel');if(!im.className)im.removeAttribute('class');if(im.dataset.pending)return im.remove();if(im.dataset.od){im.removeAttribute('src');im.classList.remove('imgload');if(!im.className)im.removeAttribute('class');im.removeAttribute('alt')}else if(/^blob:/.test(im.getAttribute('src')||''))im.remove()});return c.innerHTML}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return iso(d)+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'_'+Math.random().toString(36).slice(2,8)}
async function uploadImg(blob){const ext=((blob.type||'image/png').split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');const p='images/'+stamp()+'.'+ext;
 const r=await gfetch(GI(p),{method:'PUT',headers:{'Content-Type':blob.type||'image/png'},body:blob});if(!r.ok)throw new Error('Upload failed ('+r.status+')');imgCache.set(p,Promise.resolve(URL.createObjectURL(blob)));return p}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function pasteImg(file){const id='p'+Math.random().toString(36).slice(2),k=iso(cur);
 document.execCommand('insertHTML',false,'<img data-pending="'+id+'" class="imgup" src="'+URL.createObjectURL(file)+'"><br>');
 const el=()=>document.querySelector('img[data-pending="'+id+'"]');
 try{const p=await uploadImg(file);const im=el();if(im){delete im.dataset.pending;im.classList.remove('imgup');im.dataset.od=p;getImg(p).then(u=>im.src=u)}
  else{data.notes[k]=(data.notes[k]||'')+'<img data-od="'+p+'"><br>'}}
 catch(e){const im=el(),du=await toDataURL(file);if(im){delete im.dataset.pending;im.classList.remove('imgup');im.src=du}else data.notes[k]=(data.notes[k]||'')+'<img src="'+du+'"><br>';
  st('Image not uploaded ('+e.message+'); kept inside the note instead',true)}
 if(iso(cur)===k)data.notes[k]=noteHTML();save()}
let migrating=false;
async function migrateImgs(){if(migrating)return;migrating=true;let changed=false,failed=0;
 try{for(const k of Object.keys(data.notes)){const v=data.notes[k];if(!/<img[^>]+src=["']data:/i.test(v))continue;
  const d=document.createElement('div');d.innerHTML=v;let ch=false;
  for(const im of d.querySelectorAll('img[src^="data:"]')){try{const b=await (await fetch(im.getAttribute('src'))).blob();const p=await uploadImg(b);im.removeAttribute('src');im.dataset.od=p;ch=true}catch(e){failed++}}
  if(ch&&data.notes[k]===v){data.notes[k]=d.innerHTML;changed=true;if(k===iso(cur)&&document.activeElement!==$('txt'))showDay()}}
 if(changed)save();if(failed)st(failed+' old image(s) could not be moved to OneDrive; kept inside notes',true)}finally{migrating=false}}
// ===== Orphan image cleanup (30-day grace) =====
let cleaning=false;
async function cleanupImgs(){const td=iso(new Date());if(cleaning||!fh||!acct&&!window.__test||saving||dirty||migrating||data.lastCleanup===td)return;cleaning=true;
 try{let url='https://graph.microsoft.com/v1.0/me/drive/special/approot:/images:/children?$select=name,file&$top=200',files=[];
  while(url){const r=await gfetch(url);if(r.status==404){files=[];break}if(!r.ok)return;const j=await r.json();(j.value||[]).forEach(f=>{if(f.file&&f.name&&!f.name.includes('/'))files.push('images/'+f.name)});url=j['@odata.nextLink']||null}
  if(saving||dirty)return;
  const refs=new Set(),txt=JSON.stringify({n:data.notes,t:data.tasks,y:data.yearly})+($('txt')?$('txt').innerHTML:'');
  (txt.match(/images\/[A-Za-z0-9_.\-]+/g)||[]).forEach(p=>refs.add(p));
  const orph=data.orphans=data.orphans||{},listed=new Set(files);let ch=false;
  for(const p in orph)if(!listed.has(p)||refs.has(p)){delete orph[p];ch=true}
  for(const p of files){if(refs.has(p)||!/^images\/[^\/]+$/.test(p))continue;
   if(!orph[p]){orph[p]=td;ch=true;continue}
   if((new Date(td+'T12:00')-new Date(orph[p]+'T12:00'))/864e5>=7){const r=await gfetch(GI(p),{method:'DELETE'});if(r.ok||r.status==404){delete orph[p];imgCache.delete(p);ch=true}}}
  data.lastCleanup=td;save()}catch(e){}finally{cleaning=false}}

$('txt').addEventListener('click',e=>{if(e.target.tagName==='IMG')selectImg(e.target);else deselImg()});

$('txt').oninput=()=>{data.notes[iso(cur)]=noteHTML();save()};
$('txt').addEventListener('keydown',e=>{if(e.key!==' '&&e.key!=='Enter')return;const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return;
 const n=s.anchorNode;if(!n||n.nodeType!==3)return;const before=n.textContent.slice(0,s.anchorOffset);
 const m=before.match(/([-+*\/x×÷^%().,$\d\s]+)=$/);if(!m)return;let ex=m[1].trim();
 if(!/\d/.test(ex)||!/\d\s*[-+*\/x×÷^%]\s*[\d(.$]|\)\s*[-+*\/x×÷^]/.test(ex))return;
 ex=ex.replace(/[$,]/g,'').replace(/[x×]/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
 if(!/^[\d\s.+\-*\/()]+$/.test(ex))return;let v;try{v=Function('"use strict";return ('+ex+')')()}catch(_){return}
 if(typeof v!=='number'||!isFinite(v))return;v=Math.round(v*1e10)/1e10;
 const out=Math.abs(v)>=1000?v.toLocaleString('en-US',{maximumFractionDigits:10}):String(v);
 document.execCommand('insertText',false,out)});
$('txt').onpaste=e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));
 if(it){e.preventDefault();if(!fh)return;pasteImg(it.getAsFile());return}
 e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};
$('prev').onclick=()=>{cur.setDate(cur.getDate()-1);showDay()};
$('next').onclick=()=>{cur.setDate(cur.getDate()+1);showDay()};

function tab(n){lastTab=n;$('search').hidden=true;$('notes').hidden=n!='n';$('tasks').hidden=n!='t';$('yearly').hidden=n!='y';$('tn').classList.toggle('on',n=='n');$('tt').classList.toggle('on',n=='t');$('ty').classList.toggle('on',n=='y')}
$('tn').onclick=()=>tab('n');$('tt').onclick=()=>tab('t');$('ty').onclick=()=>tab('y');
function render(){const td=iso(new Date());let ch=false;data.tasks.forEach(x=>{if(x.flag=='yellow'){if(!x.fd){x.fd=td;ch=true}else if(x.fd<td){x.flag='red';x.fd=td;ch=true}}});if(ch&&fh)save();
 $('list').innerHTML='';$('alist').innerHTML='';let a=0;const rank={red:0,yellow:1};
 const act=data.tasks.filter(x=>!x.done).sort((p,q)=>(rank[p.flag]??2)-(rank[q.flag]??2));
 [...act,...data.tasks.filter(x=>x.done)].forEach(x=>{const li=document.createElement('li'),d=document.createElement('span');d.className='dot';d.title=x.done?'Restore':'Archive';
 d.onclick=()=>{x.done=!x.done;x.when=iso(new Date());save();render()};
 const f=document.createElement('span');f.className='flag '+(x.flag||'none');f.textContent='\u2691';f.title='Click: no flag, yellow (by tomorrow), red (today)';
 f.onclick=()=>{x.flag=x.flag==null||x.flag=='none'?'yellow':x.flag=='yellow'?'red':'none';x.fd=iso(new Date());save();render()};
 if(x.flag=='red')li.classList.add('red');if(x.flag=='yellow')li.classList.add('yel');
 const s=document.createElement('small');s.textContent=x.when||'';li.append(d,f,x.text,s);
 (x.done?(a++,$('alist')):$('list')).append(li)});$('ac').textContent=a}
function add(){const v=$('newt').value.trim();if(!v)return;data.tasks.unshift({text:v,done:false,when:iso(new Date())});$('newt').value='';save();render()}
$('addb').onclick=add;$('newt').onkeydown=e=>{if(e.key=='Enter')add()};
setInterval(()=>{render();if(!document.querySelector(".det .nm:not([hidden])"))rY();if(iso(cur)!==iso(new Date())&&$('next').disabled){cur=new Date();showDay()}},60000);

const openY=new Set();let cm=new Date();cm.setDate(1);
function ydue(y,yr){return yr+'-'+y.md}
function rY(){data.yearly=data.yearly||[];const L=$('ylist');L.innerHTML='';const now=new Date(),yr=now.getFullYear(),td=iso(now);
 const soon=iso(new Date(now.getTime()+14*864e5));
 data.yearly.forEach(y=>{if(y.start==null){y.start=(ydue(y,yr)<td&&!(y.doneYears||[]).includes(yr))?yr+1:yr;if(fh)save()}});
 const items=data.yearly.map(y=>{const fut=(y.start||0)>yr;return {y,fut,done:!fut&&(y.doneYears||[]).includes(yr),due:ydue(y,fut?y.start:yr)}});
 items.sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));
 items.forEach(({y,fut,done,due})=>{const li=document.createElement('li'),d=document.createElement('span');d.className='dot';d.title=done?'Undo (not done this year)':'Mark done for '+yr;
  d.onclick=()=>{y.doneYears=y.doneYears||[];done?y.doneYears=y.doneYears.filter(v=>v!=yr):y.doneYears.push(yr);save();rY()};
  if(done)li.classList.add('ydone');else if(fut);else if(due<td)li.classList.add('yover');else if(due<=soon)li.classList.add('ysoon');
  const s=document.createElement('small');const dt=new Date(due+'T12:00');s.textContent=(done?'Done for '+yr+' \u00b7 next ':fut?'Starts ':due<td?'Overdue \u00b7 ':'Due ')+dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+(fut?', '+y.start:'');
  const x=document.createElement('span');x.className='x';x.textContent='\u2715';x.title='Remove this yearly task';x.onclick=()=>{if(confirm('Remove "'+y.text+'" for good?')){data.yearly=data.yearly.filter(z=>z!==y);save();rY()}};
  const tx=document.createElement('span');tx.className='yt';tx.textContent=y.text+(y.det?' \ud83d\udcdd':'');tx.title='Click for details';
  const box=document.createElement('div');box.className='det';box.hidden=!openY.has(y);
  tx.onclick=()=>{openY.has(y)?openY.delete(y):openY.add(y);rY()};
  const view=document.createElement('div');view.className='dv';const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  view.innerHTML=y.det?esc(y.det).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>'):'<i>No details yet.</i>';
  const ta=document.createElement('textarea');ta.value=y.det||'';ta.hidden=true;ta.placeholder='Instructions, links, file locations...';
  const nm=document.createElement('input');nm.className='nm';nm.value=y.text;nm.hidden=true;nm.placeholder='Task name';
  const dd=document.createElement('input');dd.type='date';dd.className='nm';dd.hidden=true;dd.value=new Date().getFullYear()+'-'+y.md;
  const eb=document.createElement('button');eb.className='b';eb.textContent='Edit';
  eb.onclick=()=>{if(ta.hidden){ta.hidden=nm.hidden=dd.hidden=false;view.hidden=true;eb.textContent='Done';nm.focus()}else{if(nm.value.trim())y.text=nm.value.trim();if(dd.value&&dd.value.slice(5)!=y.md){y.md=dd.value.slice(5);const ny=new Date().getFullYear();y.start=(ny+'-'+y.md)<iso(new Date())&&!(y.doneYears||[]).includes(ny)?ny+1:ny}y.det=ta.value;save();rY()}};
  ta.oninput=()=>{y.det=ta.value;save()};
  box.append(nm,dd,view,ta,eb);li.append(d,tx,s,x,box);L.append(li)});rCal()}
function rCal(){const g=$('cgrid');g.innerHTML='';const yr=cm.getFullYear(),m=cm.getMonth(),td=iso(new Date());
 $('cmon').textContent=cm.toLocaleDateString(undefined,{month:'long',year:'numeric'});
 'Sun Mon Tue Wed Thu Fri Sat'.split(' ').forEach(t=>{const e=document.createElement('div');e.className='dh';e.textContent=t;g.append(e)});
 for(let i=0;i<cm.getDay();i++)g.append(document.createElement('div'));
 const nd=new Date(yr,m+1,0).getDate();
 for(let d=1;d<=nd;d++){const c=document.createElement('div'),k=iso(new Date(yr,m,d));if(k==td)c.className='td';c.innerHTML='<span class="n">'+d+'</span>';
  (data.yearly||[]).filter(y=>y.md==k.slice(5)&&(y.start||0)<=yr).forEach(y=>{const e=document.createElement('div');e.className='ev';const dn=(y.doneYears||[]).includes(yr);if(dn)e.classList.add('d');else if(k<td)e.classList.add('o');e.textContent=y.text;e.title=y.text;c.append(e)});
  g.append(c)}}
$('cprev').onclick=()=>{cm.setMonth(cm.getMonth()-1);rCal()};$('cnext').onclick=()=>{cm.setMonth(cm.getMonth()+1);rCal()};
function yadd(){const t=$('ytext').value.trim(),d=$('ydate').value;if(!t||!d)return alert('Enter a task and a due date.');data.yearly=data.yearly||[];const ny=new Date().getFullYear();data.yearly.push({text:t,md:d.slice(5),doneYears:[],start:(ny+'-'+d.slice(5))<iso(new Date())?ny+1:ny});$('ytext').value='';$('ydate').value='';save();rY()}

document.querySelectorAll('#tb button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if($('txt').contentEditable!=='true')return;$('txt').focus();
 const c=b.dataset.c,v=b.dataset.v;document.execCommand('styleWithCSS',false,c=='hl'||c=='foreColor');
 if(c=='hl')document.execCommand('hiliteColor',false,v);else document.execCommand(c,false,v||null);
 data.notes[iso(cur)]=noteHTML();save()}});
function lock(on){$('txt').contentEditable=!on;$('newt').disabled=on;$('addb').disabled=on;$('yadd').disabled=on;$('ytext').disabled=on;if(on)$('txt').dataset.ph='Sign in with Microsoft above to load your notes.';else $('txt').dataset.ph="Today's work notes... (paste screenshots with Ctrl+V)"}
var lastTab='n';
const sesc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function plain(h){const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<img[^>]*>/gi,' ');d.querySelectorAll('br,div,p,li,h3').forEach(e=>e.after(' '));return d.textContent.replace(/\s+/g,' ').trim()}
function snip(t,q){const i=t.toLowerCase().indexOf(q);const a=Math.max(0,i-50),b=Math.min(t.length,i+q.length+70);return (a?'\u2026':'')+sesc(t.slice(a,i))+'<mark>'+sesc(t.slice(i,i+q.length))+'</mark>'+sesc(t.slice(i+q.length,b))+(b<t.length?'\u2026':'')}
function doSearch(){const raw=$('sq').value.trim(),q=raw.toLowerCase().replace(/\s+/g,' ');$('sx').hidden=!raw;
 if(!q){if(!$('search').hidden)tab(lastTab);return}
 const keep=lastTab;['notes','tasks','yearly'].forEach(i=>$(i).hidden=true);$('search').hidden=false;['tn','tt','ty'].forEach(i=>$(i).classList.remove('on'));lastTab=keep;
 const R=$('sres');R.innerHTML='';let total=0;
 const grp=(title,items)=>{if(!items.length)return;total+=items.length;const h=document.createElement('h4');h.textContent=title+' ('+items.length+')';const u=document.createElement('ul');items.forEach(([meta,html,go])=>{const li=document.createElement('li');li.innerHTML='<small>'+sesc(meta)+'</small>'+html;li.onclick=go;u.append(li)});R.append(h,u)};
 const fd=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
 grp('Daily notes',Object.keys(data.notes).sort().reverse().map(k=>[k,plain(data.notes[k])]).filter(([k,t])=>t.toLowerCase().includes(q)).map(([k,t])=>[fd(k),snip(t,q),()=>openNote(k,raw.replace(/\s+/g,' '))]));
 grp('Tasks',data.tasks.filter(x=>(x.text||'').toLowerCase().includes(q)).sort((a,b)=>(b.when||'').localeCompare(a.when||'')).map(x=>[(x.done?'Archived':'Active')+(x.when?' \u00b7 '+fd(x.when):''),snip(x.text,q),()=>openTask(x)]));
 grp('Yearly tasks',(data.yearly||[]).map(y=>[y,(y.text||'')+' \u2014 '+(y.det||'').replace(/\s+/g,' ')]).filter(([y,t])=>t.toLowerCase().includes(q)).sort((a,b)=>(b[0].md||'').localeCompare(a[0].md||'')).map(([y,t])=>['Due '+new Date('2000-'+y.md+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}),snip(t,q),()=>openYear(y)]));
 if(!total)R.innerHTML='<p style="color:#888">No matches for \u201c'+sesc(raw)+'\u201d.</p>'}
function clearS(){$('sq').value='';doSearch()}
function openNote(k,raw){clearS();cur=new Date(k+'T12:00');tab('n');showDay();setTimeout(()=>{const sel=getSelection();sel.removeAllRanges();const r=document.createRange();r.setStart($('txt'),0);r.collapse(true);sel.addRange(r);if(window.find&&window.find(raw,false,false,false,false,false,false)){const n=getSelection().anchorNode;(n&&n.parentElement||$('txt')).scrollIntoView({block:'center'})}else $('txt').scrollIntoView()},50)}
function flash(li){if(!li)return;li.scrollIntoView({block:'center'});li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),2500)}
function openTask(x){clearS();tab('t');render();if(x.done)document.querySelector('#tasks details').open=true;flash([...document.querySelectorAll('#list li,#alist li')].find(li=>li.textContent.includes(x.text)))}

$('sq').oninput=doSearch;$('sq').onkeydown=e=>{if(e.key=='Escape')clearS()};$('sx').onclick=clearS;
